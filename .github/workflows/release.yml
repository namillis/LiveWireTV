name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Derive version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. v1.2.3
          NAME="${TAG#v}"                    # 1.2.3
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"   # monotonic versionCode

      - name: Decode keystore (if signing secrets are configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Write outside the workspace so it can't be picked up by any build glob.
            KS="$RUNNER_TEMP/livewire-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "path=$KS" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret set — building an UNSIGNED release APK."
          fi

      - name: Build release APK
        env:
          # Signing values reach Gradle only as env vars (never CLI args / never logged).
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName="${{ steps.ver.outputs.name }}" \
            -PversionCode="${{ steps.ver.outputs.code }}"

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          cp "$APK" "livewire-${{ steps.ver.outputs.name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: livewire-${{ steps.ver.outputs.name }}.apk
          generate_release_notes: true
          body: |
            LiveWire ${{ github.ref_name }}

            ${{ steps.keystore.outputs.signed == 'true' && 'Signed release APK — installs and updates in place.' || '⚠️ UNSIGNED APK (no signing secrets configured). For real installs, add the keystore secrets (see docs/RELEASING.md) and re-tag.' }}

            Sideload: download the APK and `adb install -r livewire-${{ steps.ver.outputs.name }}.apk`
