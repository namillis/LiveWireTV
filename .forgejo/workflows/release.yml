name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    # Needs a Forgejo runner registered with the `docker` label (see docs/RELEASING.md).
    runs-on: docker
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history and tags, for the release notes

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: bash scripts/ci/setup-android-sdk.sh

      - name: Derive version from tag
        id: ver
        run: |
          read -r NAME CODE < <(bash scripts/ci/version-from-tag.sh "${GITHUB_REF_NAME}")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$NAME versionCode=$CODE"

      - name: Decode keystore (if signing secrets are configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Write outside the workspace so it can't be picked up by any build glob.
            KS="$RUNNER_TEMP/livewire-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "path=$KS" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret set — building an UNSIGNED release APK."
          fi

      - name: Build release APK
        env:
          # Signing values reach Gradle only as env vars (never CLI args / never logged).
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName="${{ steps.ver.outputs.name }}" \
            -PversionCode="${{ steps.ver.outputs.code }}"

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/livewire-release.jks"

      - name: Collect APK, checksum and update manifest
        run: |
          NAME="${{ steps.ver.outputs.name }}"
          CODE="${{ steps.ver.outputs.code }}"
          APK="livewire-${NAME}.apk"
          mkdir -p dist
          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -1)" "dist/$APK"
          cd dist
          # sha256sum-format sidecar: "<64-hex>  <filename>" (the updater parses the first token).
          sha256sum "$APK" > "${APK}.sha256"
          SHA=$(cut -d' ' -f1 "${APK}.sha256")
          SIZE=$(wc -c < "$APK" | tr -d ' ')
          # minSdk is fixed in the module; keep it here so the manifest is self-describing.
          MINSDK=23
          printf '{\n  "version": "%s",\n  "versionCode": %s,\n  "sha256": "%s",\n  "size": %s,\n  "minSdk": %s\n}\n' \
            "$NAME" "$CODE" "$SHA" "$SIZE" "$MINSDK" > update.json
          echo "Prepared ${APK} (sha256=${SHA} size=${SIZE})"

      - name: Write release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${{ steps.ver.outputs.name }}"
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)
          {
            echo "LiveWire ${TAG}"
            echo
            if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
              echo "Signed release APK. Installs and updates in place."
            else
              echo "⚠️ UNSIGNED APK (no signing secrets configured). For real installs, add the keystore secrets (see docs/RELEASING.md) and tag the next patch version."
            fi
            echo
            echo "Sideload: download the APK and \`adb install -r livewire-${NAME}.apk\`"
            if [ -n "$PREV" ]; then
              echo
              echo "## Changes since ${PREV}"
              echo
              git log --first-parent --format='- %s' "${PREV}..${TAG}"
            fi
          } > dist/NOTES.md
          cat dist/NOTES.md

      - name: Publish Forgejo release
        run: |
          N="${{ steps.ver.outputs.name }}"
          bash scripts/ci/publish-forgejo-release.sh "${GITHUB_REF_NAME}" dist/NOTES.md \
            "dist/livewire-${N}.apk" "dist/livewire-${N}.apk.sha256" dist/update.json
