org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# --- Build toolchain ------------------------------------------------------------
# AGP 8.5 requires JDK 17, and the Kotlin compile toolchain is pinned to 17 in
# app/build.gradle.kts (kotlin { jvmToolchain(17) }), so emitted bytecode is JDK-17
# regardless of the launcher JVM.
#
# If your machine's default `java` is NOT 17 (e.g. this dev host defaults to JDK 25,
# which Gradle cannot run under), point Gradle at a JDK 17 WITHOUT editing this
# tracked file — put the host-specific path in one of these git-ignored locations:
#   • ~/.gradle/gradle.properties   (user-global), or
#   • set JAVA_HOME before ./gradlew
# with:
#   org.gradle.java.home=/absolute/path/to/jdk-17
# See README (“JDK note”).
